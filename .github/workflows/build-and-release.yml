name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          set -e
          MAJOR=$(grep 'val versionMajor' app/build.gradle.kts | grep -o '[0-9]\+')
          MINOR=$(grep 'val versionMinor' app/build.gradle.kts | grep -o '[0-9]\+')
          PATCH=$(grep 'val versionPatch' app/build.gradle.kts | grep -o '[0-9]\+')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error::Failed to extract version from app/build.gradle.kts. Check that versionMajor, versionMinor, and versionPatch are defined."
            exit 1
          fi
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Check for duplicate release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" &>/dev/null; then
            echo "::error::Release $VERSION already exists. Bump versionMajor/versionMinor/versionPatch in app/build.gradle.kts before running this workflow."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/OrientationFaker-${VERSION}-debug.apk

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            --title "OrientationFaker ${VERSION}" \
            --notes "Automated debug build of OrientationFaker from source.

          App version: ${VERSION}
          Built from commit: ${{ github.sha }}" \
            app/build/outputs/apk/debug/OrientationFaker-${VERSION}-debug.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
